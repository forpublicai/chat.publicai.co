{{- if and .Values.argocdNotifications (and .Values.argocdNotifications.enabled .Values.argocdNotifications.secretsName) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      data:
        slack-token: '{{ "{{ .slack_token }}" }}'
        email-username: '{{ "{{ .email_username }}" }}'
        email-password: '{{ "{{ .email_password }}" }}'
  data:
    - secretKey: slack_token
      remoteRef:
        key: {{ .Values.argocdNotifications.secretsName }}
        property: slack-token
    - secretKey: email_username
      remoteRef:
        key: {{ .Values.argocdNotifications.secretsName }}
        property: email-username
    - secretKey: email_password
      remoteRef:
        key: {{ .Values.argocdNotifications.secretsName }}
        property: email-password
{{- end }}
