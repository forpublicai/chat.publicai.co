{{- if and .Values.argocdControllerService .Values.argocdControllerService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.argocdControllerService.name | default "argocd-application-controller" }}
  namespace: argocd
  labels:
    app.kubernetes.io/component: application-controller
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/part-of: argocd
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: metrics
      port: 8082
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-application-controller
{{- end }}
