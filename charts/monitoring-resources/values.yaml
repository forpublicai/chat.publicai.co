# Default values for monitoring-resources.
# This is a YAML-formatted file.

prometheus:
  secretsName: ""

grafana:
  secretsName: ""

argocdNotifications:
  enabled: true
  secretsName: "prod/publicai/argocd/notifications"

healthcheck:
  enabled: true

awsRegion: "us-east-1"

status:
  enabled: true
  replicaCount: 1
  image:
    repository: "ghcr.io/forpublicai/chat.publicai.co/status"
    tag: "run-1"
    pullPolicy: "Always"
  port: 3000
  service:
    type: ClusterIP
    port: 3000
  prometheusUrl: "http://prometheus-server.monitoring.svc.cluster.local:80"
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
