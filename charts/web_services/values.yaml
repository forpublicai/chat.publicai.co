# Global values for web-services umbrella chart
global:
  # Shared namespace for all services
  namespace: web-services
  
  # AWS configuration
  aws:
    region: eu-central-2
    
  # Ingress now handled by infrastructure chart

# OpenWebUI configuration - only environment-specific overrides
open-webui:
  enabled: true
  
  # Production-specific overrides
  app:
    webuiUrl: "https://chat.publicai.co"
    replicas: 1
    
    # Production storage configuration
    storage:
      s3:
        bucketName: publicai-bucket
        region: eu-central-2
        keyPrefix: uploads/
        endpointUrl: 	https://s3.eu-central-2.amazonaws.com
    
    # Production resource allocation for 5k concurrent users
    resources:
      requests:
        memory: "6Gi"
        cpu: "1000m"
      limits:
        memory: "10Gi"
        cpu: "2000m"

    # OpenTelemetry configuration
    otel:
      enabled: false
      metricsEnabled: false
      insecure: true
      endpoint: "http://web-services-prometheus-server:80/api/v1/otlp/v1/metrics"
      serviceName: "open-webui"

    extraEnv:
      - name: OTEL_OTLP_SPAN_EXPORTER
        value: "http"
      - name: AUDIO_STT_ENGINE
        value: "openai"
      - name: AUDIO_STT_OPENAI_API_KEY
        value: "disabled"
      - name: USER_PERMISSIONS_CHAT_STT
        value: "false"

  # Production persistence override
  persistence:
    enabled: true
    storageClass: "ebs-sc"
    size: 10Gi

  # Autoscaling for high load
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 85

  serviceAccount:
    roleArn: arn:aws:iam::901779868336:role/OpenWebUI-IRSA-Role

  # Secrets configuration
  secrets:
    name: web-services-secrets
    licenseKey: ""
    webuiSecretKey: ""
    databaseUrl: ""
    redisUrl: ""
    # googleClientId: ""
    # googleClientSecret: ""
    oauthClientId: ""
    oauthClientSecret: ""
    openidProviderUrl: ""
    openidRedirectUri: ""

# SearXNG configuration
searxng:
  enabled: false
  service:
    name: searxng-service
    port: 8080
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi" 
      cpu: "1000m"

# Tika configuration
tika:
  enabled: true
  service:
    name: tika-service
    port: 9998
  javaOpts: "-Xms256m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
  resources:
    requests:
      memory: "768Mi"    # Match actual memory request
      cpu: "250m"        # Match actual CPU request
    limits:
      memory: "2Gi"      # Keep high for OCR/large PDFs!
      cpu: "1000m"

# LiteLLM configuration
litellm:
  enabled: true
  secrets:
    litellmMasterKey: ""
  lago:
    enabled: true  # Set to true to enable Lago billing integration

# Lago billing platform configuration (official chart)
lago:
  enabled: true

  # Service Account configuration for IRSA (IAM Roles for Service Accounts)
  serviceAccount:
    roleArn: "arn:aws:iam::901779868336:role/Lago-IRSA-Role"

  # Required URLs
  apiUrl: "https://lago-api.publicai.co"
  frontUrl: "https://lago.publicai.co"

  # Use existing external database and Redis
  global:
    databaseUrl: ""  # Set via --set from web.sh
    redisUrl: ""  # Set via --set from web.sh

    # Disable signup
    signup:
      enabled: true

    # Enable S3 storage
    s3:
      enabled: true
      bucket: "publicai-bucket"
      region: "eu-central-2"
      endpoint: "https://s3.eu-central-2.amazonaws.com"

    # SMTP configuration
    smtp:
      enabled: false
      fromEmail: "support@publicai.co"

    # Disable PDF generation for now
    pdf:
      enabled: true

    # Disable ingress (we're using our own)
    ingress:
      enabled: false

  # Disable internal PostgreSQL and Redis (using external)
  postgresql:
    enabled: false

  redis:
    enabled: false

  # Resource configuration
  front:
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  api:
    replicaCount: 1
    resources:
      requests:
        memory: "1536Mi"
        cpu: "200m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  worker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  # All worker types (billing, clock, events, payment, pdf, webhook)
  billingWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  clockWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  # PDF service (Gotenberg)
  pdf:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "500m"

  eventsWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  paymentWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  pdfWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  webhookWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

# Prometheus monitoring configuration
prometheus:
  enabled: true
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  server:
    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: "ebs-sc"
    extraFlags:
      - "web.config.file=/etc/prometheus/web.config"
      - "storage.tsdb.retention.size=5GB"
      - "enable-feature=otlp-write-receiver"
    extraVolumes:
      - name: web-config
        secret:
          secretName: prometheus-web-config
    extraVolumeMounts:
      - name: web-config
        mountPath: /etc/prometheus
        readOnly: true
    adminUser: ""
    adminPassword: ""
  extraScrapeConfigs: |
    - job_name: 'litellm'
      static_configs:
        - targets: ['litellm-service:4000']
    - job_name: 'health-check'
      static_configs:
        - targets: ['health-check-service:8000']


# Grafana visualization dashboard configuration
grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  adminUser: ""
  adminPassword: ""
  persistence:
    enabled: false
  extraVolumeMounts:
    - name: health-check-dashboard-volume
      mountPath: /var/lib/grafana/dashboards/default/health-check.json
      subPath: health-check.json
      readOnly: true
    - name: health-check-dashboard-volume
      mountPath: /var/lib/grafana/dashboards/default/open-webui.json
      subPath: open-webui.json
      readOnly: true
  extraVolumes:
    - name: health-check-dashboard-volume
      configMap:
        name: health-check-dashboard-configmap
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://web-services-prometheus-server:80
          isDefault: true
          basicAuth: true
          basicAuthUser: ${PROMETHEUS_ADMIN_USER}
          secureJsonData:
            basicAuthPassword: ${PROMETHEUS_ADMIN_PASSWORD}
        - name: Loki
          type: loki
          access: proxy
          url: http://web-services-loki:3100
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      litellm-spend:
        gnetId: 24965
        revision: 1
        datasource: Prometheus
      litellm-sre:
        gnetId: 25541
        revision: 1
        datasource: Prometheus


# Loki log aggregation database configuration
loki:
  enabled: true
  deploymentMode: SingleBinary
  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    limits_config:
      retention_period: 168h
      volume_enabled: true
    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
    schemaConfig:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        directory: /var/loki/chunks
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      storageClass: ebs-sc
      size: 10Gi
  gateway:
    enabled: false
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0

# Promtail daemonset log shipper configuration
promtail:
  enabled: true
  config:
    clients:
      - url: http://web-services-loki:3100/loki/api/v1/push

# Health check configuration
healthcheck:
  enabled: true
  replicaCount: 1
  image:
    repository: "ghcr.io/forpublicai/chat.publicai.co/health-check"
    tag: "latest"
    pullPolicy: "Always"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  secrets:
    hfTestToken: ""
    zuploTest: ""
    litellmApiKey: ""
