apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Values.global.namespace | default "web-services" }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: LITELLM_DATABASE_URL
    - secretKey: redis_url
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: REDIS_URL
    - secretKey: redis_host
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: REDIS_HOST
    - secretKey: litellm_master_key
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: LITELLM_MASTER_KEY
    - secretKey: litellm_salt_key
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: LITELLM_SALT_KEY
    - secretKey: sealion_api_key
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: SEALION_API_KEY
    - secretKey: vllm_api_key_intel
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: VLLM_API_KEY_INTEL
    - secretKey: lago_api_key
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: LAGO_API_KEY
    - secretKey: dicta_api_key
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: DICTA_API_KEY
    - secretKey: infomaniak_api_key
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: INFOMANIAK_API_KEY
    - secretKey: bielik_api_key
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: BIELIK_API_KEY


