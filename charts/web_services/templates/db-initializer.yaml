apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-initializer
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: db-initializer
        image: postgres:16-alpine
        env:
        - name: MASTER_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ (index .Values "open-webui").secrets.name }}
              key: MASTER_DATABASE_URL
        command:
        - /bin/sh
        - -c
        - |
          echo "Initializing databases on RDS instance..."
          psql "$MASTER_DATABASE_URL" -c "SELECT 'CREATE DATABASE openwebui' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'openwebui')\gexec"
          psql "$MASTER_DATABASE_URL" -c "SELECT 'CREATE DATABASE litellm' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'litellm')\gexec"
          psql "$MASTER_DATABASE_URL" -c "SELECT 'CREATE DATABASE lago' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'lago')\gexec"
          echo "Database initialization complete."
