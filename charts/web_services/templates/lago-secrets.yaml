{{- if .Values.lago.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lago-db-secrets
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: lago-db-secrets
    creationPolicy: Owner
    template:
      data:
        databaseUrl: '{{ "{{ .databaseUrl }}" }}'
        redisUrl: '{{ "{{ .redisUrl }}" }}'
        redisCacheUrl: '{{ "{{ .redisUrl }}" }}'
        awsS3AccessKeyId: 'irsa'
        awsS3SecretAccessKey: 'irsa'
  data:
    - secretKey: databaseUrl
      remoteRef:
        key: {{ (index .Values "open-webui").secrets.managedSecretsName }}
        property: LAGO_DATABASE_URL
    - secretKey: redisUrl
      remoteRef:
        key: {{ (index .Values "open-webui").secrets.managedSecretsName }}
        property: LAGO_REDIS_URL
{{- end }}
