apiVersion: v2
name: web-services
description: Complete web services stack including OpenWebUI, SearXNG, and Tika
type: application
version: 1.0.0
appVersion: "1.0"

dependencies:
  - name: open-webui
    version: "0.1.0"
    repository: "file://./charts/open-webui"
  - name: searxng
    version: "0.1.0"
    repository: "file://./charts/searxng"
    condition: searxng.enabled
  - name: tika
    version: "0.1.0"
    repository: "file://./charts/tika"
  - name: litellm
    version: "0.1.0"
    repository: "file://./charts/litellm"
    condition: litellm.enabled
  - name: lago
    version: "1.27.1"
    repository: "https://getlago.github.io/lago-helm-charts"
    condition: lago.enabled
  - name: prometheus
    version: "29.17.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled
  - name: grafana
    version: "10.5.15"
    repository: "https://grafana.github.io/helm-charts"
    condition: grafana.enabled
  - name: loki
    version: "7.0.0"
    repository: "https://grafana.github.io/helm-charts"
    condition: loki.enabled
  - name: promtail
    version: "6.17.1"
    repository: "https://grafana.github.io/helm-charts"
    condition: promtail.enabled

keywords:
  - ai
  - chatbot
  - search
  - content-extraction

maintainers:
  - name: Public AI
    email: support@publicai.co