  name: Switzerland 1.5
  base_model_id: null
  meta:
    description: Switzerland is serving Apertus v1.5 70B. The model was built by the
      Swiss National AI Initiative. It is provided here courtesy of the Swiss National
      Supercomputing Centre (CSCS) and Infomaniak.
