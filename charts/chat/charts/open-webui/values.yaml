# Default values for open-webui
# This is the base configuration - override in values-prod.yaml

app:
  name: openwebui
  replicas: 2
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: v0.11.3
  port: 8080
  webuiUrl: "http://localhost:8080" # Base local default. Override in env-specific values.yaml (e.g. staging/prod)
  vectorDb: pgvector
  enableVersionUpdateCheck: "false"
  enablePersistentConfig: "true"
  
  # Affinity settings for production
  affinity:
    enabled: true
    hard: false  # Use soft anti-affinity for better scaling
  
  # Topology spread constraints
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
  
  # Storage configuration
  storage:
    provider: s3
    s3:
      bucketName: "" # Default empty. Override in env-specific values.yaml
      region: ""     # Default empty. Override in env-specific values.yaml
      keyPrefix: uploads/
  
  # Websocket configuration
  websocket:
    enabled: "true"
    manager: redis
  
  # Redis configuration  
  redis:
    cluster: "false"
    keyPrefix: "{open-webui}"
  
  # Models configuration
  defaultModels: "swiss-ai/apertus-70b-instruct"
  
  # Authentication configuration
  auth:
    enableLoginForm: "false"
    enableSignupPasswordConfirmation: "true"
    enableOauthSignup: "true"
    enableOauthPersistentConfig: "false"
    oauthUpdatePictureOnLogin: "true"
    oauthMergeAccountsByEmail: "true"
    enableOauthRoleManagement: "false"
    enableOauthGroupManagement: "false"
    openidProviderUrl: ""
    oauthScopes: "openid email profile"
    oauthUsernameClaim: "cognito:username"
    oauthEmailClaim: "email"
    oauthPictureClaim: "picture"
    enableForwardUserInfoHeaders: "true"
    signoutRedirectUrl: "http://localhost:8080/auth" # Default local redirect. Override in env-specific values.yaml
    oauthProviderName: "Public AI"
    defaultUserRole: "user"
    enableAdminChatAccess: "false"
    userPermissionsChatControls: "false"
  
  # Web Search configuration
  webSearch:
    enabled: "true"
    engine: "searxng"
    searxngQueryUrl: "http://searxng-service:8080/search?q=<query>"
  
  # Content Extraction configuration (Tika)
  contentExtraction:
    engine: "tika"
    tikaServerUrl: "http://tika-service:9998"
  
  # Resource configuration - minimal defaults
  resources:
    requests:
      memory: "2Gi"
      cpu: "300m"
    limits:
      memory: "4Gi"
      cpu: "1000m"

service:
  name: openwebui-service
  port: 8080
  type: ClusterIP

# Ingress removed - now handled by load-balancer chart

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 85
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 20
        periodSeconds: 60

serviceAccount:
  name: openwebui-sa
  roleArn: ""

secrets:
  name: chat-secrets
  licenseKey: ""
  webuiSecretKey: ""
  databaseUrl: ""
  redisUrl: ""
  # googleClientId: ""
  # googleClientSecret: ""
  oauthClientId: ""
  oauthClientSecret: ""
  openidProviderUrl: ""
  openidRedirectUri: ""