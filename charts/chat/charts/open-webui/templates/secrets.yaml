apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LICENSE_KEY: '{{ "{{ .LICENSE_KEY }}" }}'
        WEBUI_SECRET_KEY: '{{ "{{ .WEBUI_SECRET_KEY }}" }}'
        DATABASE_URL: 'postgresql://postgres:{{ "{{ .DB_PASSWORD | urlquery }}" }}@{{ "{{ .DB_HOST }}" }}:5432/openwebui?sslmode=require'
        databaseUrl: 'postgresql://postgres:{{ "{{ .DB_PASSWORD | urlquery }}" }}@{{ "{{ .DB_HOST }}" }}:5432/openwebui?sslmode=require'
        REDIS_URL: '{{ "{{ .REDIS_URL }}" }}'
        redisUrl: '{{ "{{ .REDIS_URL }}" }}'
        OAUTH_CLIENT_ID: '{{ "{{ .OAUTH_CLIENT_ID }}" }}'
        OAUTH_CLIENT_SECRET: '{{ "{{ .OAUTH_CLIENT_SECRET }}" }}'
        OPENID_PROVIDER_URL: '{{ "{{ .OPENID_PROVIDER_URL }}" }}'
        OPENID_REDIRECT_URI: '{{ "{{ .OPENID_REDIRECT_URI }}" }}'
        MASTER_DATABASE_URL: 'postgresql://postgres:{{ "{{ .DB_PASSWORD | urlquery }}" }}@{{ "{{ .DB_HOST }}" }}:5432/postgres?sslmode=require'
  data:
    - secretKey: LICENSE_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: LICENSE_KEY
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: WEBUI_SECRET_KEY
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.dbPasswordArn }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: DB_HOST
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: REDIS_URL
    - secretKey: OAUTH_CLIENT_ID
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: OAUTH_CLIENT_ID
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: OAUTH_CLIENT_SECRET
    - secretKey: OPENID_PROVIDER_URL
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: OPENID_PROVIDER_URL
    - secretKey: OPENID_REDIRECT_URI
      remoteRef:
        key: {{ .Values.secrets.managedSecretsName }}
        property: OPENID_REDIRECT_URI