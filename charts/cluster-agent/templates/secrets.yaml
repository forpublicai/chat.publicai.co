{{- if and .Values.secrets (and .Values.secrets.enabled .Values.secrets.manualSecretsName) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name | default "holmes-openrouter" }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.name | default "holmes-openrouter" }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: {{ .Values.secrets.property | default "OPENROUTER_API_KEY" }}
    {{- if .Values.secrets.argocdTokenProperty }}
    - secretKey: ARGOCD_AUTH_TOKEN
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: {{ .Values.secrets.argocdTokenProperty }}
    {{- end }}
{{- end }}
