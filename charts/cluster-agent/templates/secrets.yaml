{{- if and (ne .Values.enabled false) (and .Values.secrets (and .Values.secrets.enabled .Values.secrets.manualSecretsName)) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name | default "holmes-openrouter" }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.name | default "holmes-openrouter" }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENROUTER_API_KEY: '{{ "{{ .OPENROUTER_API_KEY }}" }}'
        {{- if .Values.secrets.argocdTokenProperty }}
        ARGOCD_AUTH_TOKEN: '{{ "{{ .ARGOCD_AUTH_TOKEN }}" }}'
        {{- end }}
        {{- if .Values.secrets.grafanaApiKeyProperty }}
        GRAFANA_API_KEY: '{{ "{{ .GRAFANA_API_KEY }}" }}'
        {{- end }}
        {{- if .Values.secrets.slackTokenProperty }}
        SLACK_TOKEN: '{{ "{{ .SLACK_TOKEN }}" }}'
        {{- end }}
        {{- if .Values.secrets.postgresPasswordProperty }}
        POSTGRES_PASSWORD: '{{ "{{ .POSTGRES_PASSWORD }}" }}'
        {{- end }}
        {{- if .Values.secrets.postgresHostProperty }}
        POSTGRES_HOST: '{{ "{{ .POSTGRES_HOST }}" }}'
        {{- end }}
        {{- if and .Values.database .Values.database.enabled }}
        POSTGRES_OPENWEBUI_URL: 'postgresql://{{ .Values.database.user | default "holmes_readonly" }}:{{ "{{ .POSTGRES_PASSWORD | urlquery }}" }}@{{ "{{ .POSTGRES_HOST }}" }}:{{ .Values.database.port | default 5432 }}/{{ .Values.database.openwebuiDbName | default "openwebui" }}'
        POSTGRES_LITELLM_URL: 'postgresql://{{ .Values.database.user | default "holmes_readonly" }}:{{ "{{ .POSTGRES_PASSWORD | urlquery }}" }}@{{ "{{ .POSTGRES_HOST }}" }}:{{ .Values.database.port | default 5432 }}/{{ .Values.database.litellmDbName | default "litellm" }}'
        {{- end }}
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: {{ .Values.secrets.property | default "OPENROUTER_API_KEY" }}
    {{- if .Values.secrets.argocdTokenProperty }}
    - secretKey: ARGOCD_AUTH_TOKEN
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: {{ .Values.secrets.argocdTokenProperty }}
    {{- end }}
    {{- if .Values.secrets.grafanaApiKeyProperty }}
    - secretKey: GRAFANA_API_KEY
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: {{ .Values.secrets.grafanaApiKeyProperty }}
    {{- end }}
    {{- if .Values.secrets.slackTokenProperty }}
    - secretKey: SLACK_TOKEN
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: {{ .Values.secrets.slackTokenProperty }}
    {{- end }}
    {{- if .Values.secrets.postgresPasswordProperty }}
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: {{ .Values.secrets.postgresPasswordProperty }}
    {{- end }}
    {{- if .Values.secrets.postgresHostProperty }}
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: {{ .Values.secrets.manualSecretsName }}
        property: {{ .Values.secrets.postgresHostProperty }}
    {{- end }}
{{- end }}
