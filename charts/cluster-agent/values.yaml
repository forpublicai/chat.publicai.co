global:
  environment: staging
  namespace: cluster-agent

secrets:
  enabled: true
  name: "holmes-openrouter"
  manualSecretsName: "/cluster-agent"
  property: "OPENROUTER_API_KEY"
  argocdTokenProperty: "ARGOCD_AUTH_TOKEN"
  grafanaApiKeyProperty: "GRAFANA_API_KEY"
  postgresPasswordProperty: "POSTGRES_PASSWORD"
  postgresHostProperty: "POSTGRES_HOST"

database:
  enabled: true
  port: 5432
  user: "holmes_readonly"
  openwebuiDbName: "openwebui"
  litellmDbName: "litellm"
  sslmode: "require"

triggeredHealthChecks:
  enabled: true
  # Auto-discover all namespaces in the cluster by default using Helm lookup
  autoDiscoverNamespaces: true
  namePrefix: "verify-rollouts"

  # Namespaces to exclude from automatic rollout verification
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - default

  # Fallback list used during offline dry-run rendering (e.g. helm template without cluster connection)
  fallbackNamespaces:
    - cluster-agent
    - chat
    - platform
    - monitoring
    - web-services
    - argocd

  # Wait time in seconds after a rollout before triggering the health check investigation.
  # Default is 300 (5 minutes). Increase this if deployments take longer to pull large images,
  # pass startup probes, or transition to Ready.
  defaultDelaySeconds: 300

  # Cooldown period in seconds to prevent re-firing repeatedly for the same deployment within this window.
  defaultCooldownSeconds: 600
  defaultTimeout: 120
  defaultMode: monitor
  defaultQuery: |
    Deployment {{ .deployment }} in namespace {{ .namespace }} was rolled out to {{ .new.image }} (was {{ .old.image }}).
    Is the new version healthy? Check pod status, restarts, warning events, error rates, and container logs before vs after the rollout, and flag any regressions.

holmes:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      memory: 2048Mi

  operator:
    enabled: true
    holmesApiTimeout: 300
    maxHistoryItems: 10
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi

  extraEnvVarsSecrets:
    - holmes-openrouter

  customClusterRoleRules:
    - apiGroups: [""]
      resources: ["pods/portforward"]
      verbs: ["create"]

  additionalEnvVars:
    - name: MODEL
      value: "claude-sonnet-4"
    - name: ARGOCD_SERVER
      value: "argocd-server.argocd.svc.cluster.local:80"
    - name: ARGOCD_OPTS
      value: "--port-forward --port-forward-namespace argocd --server argocd-server.argocd.svc.cluster.local --insecure --grpc-web"
    - name: ARGOCD_AUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: ARGOCD_AUTH_TOKEN
          optional: true
    - name: GRAFANA_API_KEY
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: GRAFANA_API_KEY
          optional: true
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: POSTGRES_PASSWORD
          optional: true
    - name: POSTGRES_OPENWEBUI_URL
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: POSTGRES_OPENWEBUI_URL
          optional: true
    - name: POSTGRES_LITELLM_URL
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: POSTGRES_LITELLM_URL
          optional: true

  # Toolsets configuration
  toolsets:
    prometheus/metrics:
      enabled: true
      subtype: prometheus
      config:
        prometheus_url: "http://prometheus-server.monitoring.svc.cluster.local:80"

        # Optional:
        #additional_headers:
        #    Authorization: "Basic <base_64_encoded_string>"

    argocd/core:
      enabled: true

    grafana/loki:
      enabled: true
      config:
        api_url: "http://grafana.monitoring.svc.cluster.local"
        api_key: "{{ env.GRAFANA_API_KEY }}"
        grafana_datasource_uid: "loki"

    postgres_openwebui:
      type: database
      config:
        connection_url: "{{ env.POSTGRES_OPENWEBUI_URL }}"
      llm_instructions: "PostgreSQL database for OpenWebUI"

    postgres_litellm:
      type: database
      config:
        connection_url: "{{ env.POSTGRES_LITELLM_URL }}"
      llm_instructions: "PostgreSQL database for LiteLLM"



  modelList:
    claude-sonnet-4:
      api_key: "{{ env.OPENROUTER_API_KEY }}"
      model: openrouter/anthropic/claude-sonnet-4.5-20250929
      temperature: 1
      thinking:
        budget_tokens: 10000
        type: enabled

    claude-opus-4:
      api_key: "{{ env.OPENROUTER_API_KEY }}"
      model: openrouter/anthropic/claude-opus-4.5-20251101
      temperature: 1

  # AWS MCP Addon
  mcpAddons:
    aws:
      enabled: true
      serviceAccount:
        create: true
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::818561370924:role/HolmesMCPRole"
      config:
        region: "us-east-1"
