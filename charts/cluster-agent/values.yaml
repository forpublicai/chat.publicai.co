global:
  environment: staging
  namespace: cluster-agent

secrets:
  enabled: true
  name: "holmes-openrouter"
  manualSecretsName: "/cluster-agent"
  property: "OPENROUTER_API_KEY"
  argocdTokenProperty: "ARGOCD_AUTH_TOKEN"
  grafanaApiKeyProperty: "GRAFANA_API_KEY"
  slackTokenProperty: "SLACK_TOKEN"
  postgresPasswordProperty: "POSTGRES_PASSWORD"
  postgresHostProperty: "POSTGRES_HOST"

database:
  enabled: true
  port: 5432
  user: "holmes_readonly"
  openwebuiDbName: "openwebui"
  litellmDbName: "litellm"
  sslmode: "require"

scheduledHealthChecks:
  enabled: true
  # Global destinations for alert mode (e.g. Slack channel)
  destinations:
    - type: slack
      config:
        channel: "#cluster-alerts"
  items:
    - name: periodic-cluster-resource-audit
      namespace: cluster-agent
      schedule: "*/15 * * * *"
      timeout: 180
      mode: alert
      query: |
        Perform an extensive cluster and node health audit:
        1. Nodes: Thoroughly check all cluster nodes. Are any nodes NotReady, experiencing MemoryPressure, DiskPressure, PIDPressure, or NetworkUnavailable conditions? Are there high node CPU/memory allocations or unevicted failed pods?
        2. Pods: Check all namespaces for pods in CrashLoopBackOff, ImagePullBackOff, Pending, Error, or terminating/stuck states. Verify recent container restart counts and check for OOMKilled events.
        3. Workloads & Infrastructure: Verify Deployment and DaemonSet replicas (desired vs available), check for failing CronJobs or stuck Jobs. Check for PersistentVolumeClaims in Pending/Lost states.
        4. Events: Check Kubernetes warning events across all namespaces in the last 15 minutes.
        If any issues are found, provide a detailed root cause diagnosis and recommended remediation steps.

    - name: periodic-loki-log-anomaly-scan
      namespace: cluster-agent
      schedule: "*/15 * * * *"
      timeout: 180
      mode: alert
      query: |
        Scan the last 15 minutes of logs across everything Loki tracks:
        1. Search Loki for elevated error rates, warning spikes, tracebacks, unhandled exceptions, and critical log messages across all services.
        2. Pay special attention to core application workloads (chat, openwebui, litellm, lago, ingress-alb) and platform components.
        3. Correlate any errors found with recent container restarts or HTTP 5xx responses.
        If any errors or anomalies are found, investigate the underlying cause, identify the affected service/pod, and provide a clear root cause summary with recommended action steps.

triggeredHealthChecks:
  enabled: true
  autoDiscoverNamespaces: true
  namePrefix: "verify-rollouts"

  # Namespaces to exclude from automatic rollout verification
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - default
    - web-services

  # Fallback list used during offline dry-run rendering (e.g. helm template without cluster connection)
  fallbackNamespaces:
    - cluster-agent
    - chat
    - platform
    - monitoring
    - argocd

  defaultDelaySeconds: 300
  defaultCooldownSeconds: 600
  defaultTimeout: 120
  defaultMode: monitor
  defaultQuery: |
    Deployment {{ .deployment }} in namespace {{ .namespace }} was rolled out to {{ .new.image }} (was {{ .old.image }}).
    Is the new version healthy? Check pod status, restarts, warning events, error rates, and container logs before vs after the rollout, and flag any regressions.

holmes:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      memory: 2048Mi

  operator:
    enabled: true
    holmesApiTimeout: 300
    maxHistoryItems: 10
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi

  extraEnvVarsSecrets:
    - holmes-openrouter

  customClusterRoleRules:
    - apiGroups: [""]
      resources: ["pods/portforward"]
      verbs: ["create"]

  additionalEnvVars:
    - name: HOME
      value: "/tmp"
    - name: MODEL
      value: "gemma-4-31b"
    - name: ARGOCD_SERVER
      value: "argocd-server.argocd.svc.cluster.local:80"
    - name: ARGOCD_OPTS
      value: "--server argocd-server.argocd.svc.cluster.local:80 --plaintext"
    - name: ARGOCD_AUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: ARGOCD_AUTH_TOKEN
          optional: true
    - name: GRAFANA_API_KEY
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: GRAFANA_API_KEY
          optional: true
    - name: SLACK_TOKEN
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: SLACK_TOKEN
          optional: true
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: POSTGRES_PASSWORD
          optional: true
    - name: POSTGRES_OPENWEBUI_URL
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: POSTGRES_OPENWEBUI_URL
          optional: true
    - name: POSTGRES_LITELLM_URL
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: POSTGRES_LITELLM_URL
          optional: true

  # Toolsets configuration
  toolsets:
    prometheus/metrics:
      enabled: false

        # Optional:
        #additional_headers:
        #    Authorization: "Basic <base_64_encoded_string>"

    argocd/core:
      enabled: true

    grafana/loki:
      enabled: true
      config:
        api_url: "http://grafana.monitoring.svc.cluster.local"
        api_key: "{{ env.GRAFANA_API_KEY }}"
        grafana_datasource_uid: "loki"

    postgres_openwebui:
      type: database
      config:
        connection_url: "{{ env.POSTGRES_OPENWEBUI_URL }}"
      llm_instructions: "PostgreSQL database for OpenWebUI"

    postgres_litellm:
      type: database
      config:
        connection_url: "{{ env.POSTGRES_LITELLM_URL }}"
      llm_instructions: "PostgreSQL database for LiteLLM"



  modelList:
    gemma-4-31b:
      api_key: "{{ env.OPENROUTER_API_KEY }}"
      model: openrouter/google/gemma-4-31b-it
      temperature: 0.7

  # AWS MCP Addon
  mcpAddons:
    aws:
      enabled: true
      serviceAccount:
        create: true
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::818561370924:role/HolmesMCPRole"
      config:
        region: "us-east-1"
