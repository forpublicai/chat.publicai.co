enabled: true
global:
  environment: staging
  namespace: cluster-agent

secrets:
  enabled: true
  name: "holmes-openrouter"
  manualSecretsName: "/cluster-agent"
  property: "OPENROUTER_API_KEY"
  argocdTokenProperty: "ARGOCD_AUTH_TOKEN"
  grafanaApiKeyProperty: "GRAFANA_API_KEY"
  slackTokenProperty: "SLACK_TOKEN"
  postgresPasswordProperty: "POSTGRES_PASSWORD"
  postgresHostProperty: "POSTGRES_HOST"

database:
  enabled: true
  port: 5432
  user: "holmes_readonly"
  openwebuiDbName: "openwebui"
  litellmDbName: "litellm"
  sslmode: "require"

scheduledHealthChecks:
  enabled: true
  # Global destinations for alert mode (e.g. Slack channel)
  destinations:
    - type: slack
      config:
        channel: "#cluster-alerts"
  items:
    - name: periodic-cluster-health-audit
      namespace: cluster-agent
      schedule: "0 */3 * * *"
      timeout: 240
      mode: alert
      query: |
        Perform a comprehensive cluster health and log audit across all namespaces:
        1. Run a fast cluster health scan using the kubernetes fast tool to inspect nodes, workloads, and pods.
        2. Run a fast log analysis using the kubernetes logs fast tool to detect error patterns, warning spikes, and crash loops.
        Correlate any degraded workloads or pod restarts with log errors, diagnose root causes, and provide an executive summary with recommended remediation steps.

triggeredHealthChecks:
  enabled: true
  autoDiscoverNamespaces: true
  namePrefix: "verify-rollouts"

  # Namespaces to exclude from automatic rollout verification
  excludeNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
    - default
    - web-services

  # Fallback list used during offline dry-run rendering (e.g. helm template without cluster connection)
  fallbackNamespaces:
    - cluster-agent
    - chat
    - platform
    - monitoring
    - argocd

  defaultDelaySeconds: 300
  defaultCooldownSeconds: 600
  defaultTimeout: 120
  defaultMode: alert
  destinations:
    - type: slack
      config:
        channel: "#cluster-alerts"
  defaultQuery: |
    Deployment {{ .deployment }} in namespace {{ .namespace }} was rolled out to {{ .new.image }} (was {{ .old.image }}).
    Is the new version healthy? Check pod status, restarts, warning events, error rates, and container logs before vs after the rollout, and flag any regressions.

holmes:
  enabled: true
  registry: ghcr.io
  image: forpublicai/holmes:pai-0.46.0-b3
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 1024Mi
    limits:
      memory: 2048Mi

  operator:
    enabled: true
    registry: ghcr.io
    image: forpublicai/holmes-operator:pai-0.46.0-b3
    imagePullPolicy: IfNotPresent
    holmesApiTimeout: 300
    maxHistoryItems: 10
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi

  extraEnvVarsSecrets:
    - holmes-openrouter

  customClusterRoleRules:
    - apiGroups: [""]
      resources: ["pods/portforward"]
      verbs: ["create"]

  additionalEnvVars:
    - name: HOME
      value: "/tmp"
    - name: OVERRIDE_MAX_OUTPUT_TOKEN
      value: "4096"
    - name: OVERRIDE_MAX_CONTENT_SIZE
      value: "128000"
    - name: MODEL
      value: "gpt-4o-mini"
    - name: ARGOCD_SERVER
      value: "argocd-server.argocd.svc.cluster.local:80"
    - name: ARGOCD_OPTS
      value: "--server argocd-server.argocd.svc.cluster.local:80 --plaintext"
    - name: ARGOCD_AUTH_TOKEN
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: ARGOCD_AUTH_TOKEN
          optional: true
    - name: GRAFANA_API_KEY
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: GRAFANA_API_KEY
          optional: true
    - name: SLACK_TOKEN
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: SLACK_TOKEN
          optional: true
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: POSTGRES_PASSWORD
          optional: true
    - name: POSTGRES_OPENWEBUI_URL
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: POSTGRES_OPENWEBUI_URL
          optional: true
    - name: POSTGRES_LITELLM_URL
      valueFrom:
        secretKeyRef:
          name: holmes-openrouter
          key: POSTGRES_LITELLM_URL
          optional: true

  disableAllByDefault: true

  # Toolsets configuration - only kubernetes/fast and kubernetes/logs_fast are active
  toolsets:
    kubernetes/fast:
      enabled: true

    kubernetes/logs_fast:
      enabled: true

    kubernetes/core:
      enabled: false

    bash:
      enabled: false

    kubernetes/live-metrics:
      enabled: false

    kubernetes/logs:
      enabled: false

    prometheus/metrics:
      enabled: false

    argocd/core:
      enabled: false

    grafana/loki:
      enabled: false

  modelList:
    gpt-4o-mini:
      api_key: "{{ env.OPENROUTER_API_KEY }}"
      model: openrouter/openai/gpt-4o-mini
      temperature: 0.1

  # AWS MCP Addon
  mcpAddons:
    aws:
      enabled: false
