environments:
  - staging
  - prod
models:
- model_name: mistralai/mistral-large-3-fallback
  litellm_params:
    model: bedrock/mistral.mistral-large-3-675b-instruct
    aws_region_name: us-east-1
  model_info:
    input_cost_per_token: 0.00000050
    output_cost_per_token: 0.00000150
    access_groups: ["alpha-public","alpha-private","fallback"] #even though this is in another access group it can still be accessed when used as a fallback.
