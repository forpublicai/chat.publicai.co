environments:
  - staging
  - prod
models:
- model_name: mistralai/mistral-medium-3-5
  litellm_params:
    model: mistral/mistral-medium-3-5
    api_key: os.environ/MISTRAL_API_KEY
  model_info:
    input_cost_per_token: 0.00000150
    output_cost_per_token: 0.00000750
    access_groups: ["alpha-public", "alpha-private"]
fallbacks:
  - mistralai/mistral-medium-3-5-fallback