environments:
  - staging
  - prod

pass_through_endpoints:
  - path: "/v1/systemone"
    target: "https://api.impossibl.com/v1/systemone"
    auth: true
    headers:
      Authorization: "Bearer os.environ/IMPOSSIBL_API_KEY"
      Content-Type: "application/json"
    forward_headers: true
    model_info:
      access_groups: ["alpha-public", "alpha-private"]
