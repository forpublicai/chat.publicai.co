environments:
  - staging
  - prod

pass_through_endpoints:
  - path: "/v1/cloudflare/clef-flash"
    target: "https://api.cloudflare.com/client/v4/accounts/a94ae8014786226ffd2010fd5cd5a525/ai/run/@cf/cloudflare/clef-flash"
    auth: true
    headers:
      Authorization: "Bearer os.environ/CLOUDFLARE_API_KEY"
      Content-Type: "application/json"
    forward_headers: true
    model_info:
      access_groups: ["alpha-public", "alpha-private"]
