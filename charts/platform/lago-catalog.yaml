          - allenai/Olmo-3-7B-Instruct
          - allenai/Olmo-3-7B-Think
          - allenai/Olmo-3.1-32B-Instruct
          - allenai/Olmo-3.1-32B-Think
          - dicta-il/DictaLM-3.0-24B-Thinking
          - mistralai/ministral-14b-2512
