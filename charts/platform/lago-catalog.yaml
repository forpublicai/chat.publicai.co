# Lago Billing Catalog
# This file is synced automatically to Lago by Helm via the lago-catalog-syncer Job.
# You can define billable metrics, plans, charges, and per-model filter pricing here.

billable_metrics:
  - code: public_ai_models
    name: public_ai_models
    description: "Public AI Models token usage"
    aggregation_type: sum_agg
    field_name: tokens
    recurring: false
    filters:
      - key: model
        values:
          - BSC-LT/ALIA-40b-instruct
          - Cohere/Cohere-embed-multilingual-v3.0
          - Cohere/rerank-v3.5
          - cohere/command-a-plus-05-2026-w4a4
          - aisingapore/Gemma-SEA-LION-v4-27B-IT
          - aisingapore/Nemotron-SEA-LION-v4.8-120B-A12B
          - aisingapore/Qwen-SEA-LION-v4-32B-IT
          - aisingapore/Qwen-SEA-LION-v4.5-27B-IT
          - allenai/Molmo2-8B
          - allenai/Olmo-3-32B-Think
          - allenai/Olmo-3-7B-Instruct
          - allenai/Olmo-3-7B-Think
          - allenai/Olmo-3.1-32B-Instruct
          - allenai/Olmo-3.1-32B-Think
          - dicta-il/DictaLM-3.0-24B-Thinking
          - mistralai/mistral-small-3-1
          - speakleash/Bielik-11B-v3.0-Instruct
          - swiss-ai/apertus-70b-instruct
          - swiss-ai/apertus-8b-instruct
          - swiss-ai/apertus-v1.5-70b
          - swiss-ai/apertus-v1.5-70b-thinking
          - swiss-ai/apertus-v1.5-8b
          - swiss-ai/apertus-v1.5-8b-thinking
          - utter-project/EuroLLM-22B-Instruct-2512
      - key: type
        values:
          - input
          - output

plans:
  - name: "Pay as you go"
    code: pay_as_you_go
    interval: monthly
    pay_in_advance: true
    amount_cents: 0
    amount_currency: USD
    charges:
      - billable_metric_code: public_ai_models
        charge_model: package
        pay_in_advance: true
        properties:
          amount: "0.0002"
          free_units: 0
          package_size: 1000
        filters:
          # Olmo 3 7B Instruct
          - model: allenai/Olmo-3-7B-Instruct
            type: input
            amount: "0.00010"
            package_size: 1000
            free_units: 0
          - model: allenai/Olmo-3-7B-Instruct
            type: output
            amount: "0.00020"
            package_size: 1000
