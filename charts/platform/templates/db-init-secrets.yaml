apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-init-secrets
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: platform-db-init-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MASTER_DATABASE_URL: 'postgresql://postgres:{{ "{{ .DB_PASSWORD | urlquery }}" }}@{{ "{{ .DB_HOST }}" }}:5432/postgres?sslmode=require'
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.litellm.secrets.dbPasswordArn }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.litellm.secrets.managedSecretsName }}
        property: DB_HOST
