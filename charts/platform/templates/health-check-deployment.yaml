{{- if .Values.healthcheck.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-check
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
spec:
  replicas: {{ .Values.healthcheck.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: health-check
  template:
    metadata:
      labels:
        app: health-check
    spec:
      containers:
        - name: health-check
          image: "{{ .Values.healthcheck.image.repository }}:{{ .Values.healthcheck.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.healthcheck.image.pullPolicy | default "Always" | quote }}
          ports:
            - containerPort: {{ .Values.healthcheck.port | default 8000 }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.healthcheck.port | default 8000 | quote }}
            {{- if .Values.healthcheck.modelsDir }}
            - name: MODELS_DIR
              value: {{ .Values.healthcheck.modelsDir | quote }}
            {{- end }}
            - name: MODELS_REPO_URL
              value: {{ .Values.healthcheck.modelsRepoUrl | default "https://github.com/forpublicai/chat.publicai.co.git" | quote }}
            {{- if .Values.healthcheck.extraModelsDir }}
            - name: EXTRA_MODELS_DIR
              value: {{ .Values.healthcheck.extraModelsDir | quote }}
            {{- end }}
            - name: EXTRA_MODELS_REPO_URL
              value: {{ .Values.healthcheck.extraModelsRepoUrl | default "https://github.com/currentai-org/infra.git" | quote }}
            - name: EXTRA_MODELS_REPO_BRANCH
              value: {{ .Values.healthcheck.extraModelsRepoBranch | default "dev" | quote }}
            - name: CURRENTAI_ROUTER_URL
              value: {{ .Values.healthcheck.currentaiRouterUrl | default "https://api-internal.currentai.co" | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.healthcheck.secrets.name | default "health-check-secrets" }}
          resources:
            {{- toYaml .Values.healthcheck.resources | nindent 12 }}
{{- end }}

