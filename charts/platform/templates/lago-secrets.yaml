{{- if .Values.lago.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lago-db-secrets
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: lago-db-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        databaseUrl: 'postgresql://postgres:{{ "{{ .DB_PASSWORD | urlquery }}" }}@{{ "{{ .DB_HOST }}" }}:5432/lago?sslmode=require'
        redisUrl: '{{ "{{ .redisUrl }}" }}'
        redisCacheUrl: '{{ "{{ .redisUrl }}" }}'
        awsS3AccessKeyId: 'irsa'
        awsS3SecretAccessKey: 'irsa'
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ .Values.litellm.secrets.dbPasswordArn }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.litellm.secrets.managedSecretsName }}
        property: DB_HOST
    - secretKey: redisUrl
      remoteRef:
        key: {{ .Values.litellm.secrets.managedSecretsName }}
        property: LAGO_REDIS_URL
---
{{- if and .Values.lago.secrets .Values.lago.secrets.manualSecretsName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lago-encryption-secrets
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/resource-policy: keep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.lago.encryption.existingSecret | default "lago-encryption-secrets" }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: encryptionPrimaryKey
      remoteRef:
        key: {{ .Values.lago.secrets.manualSecretsName }}
        property: LAGO_ENCRYPTION_PRIMARY_KEY
    - secretKey: encryptionDeterministicKey
      remoteRef:
        key: {{ .Values.lago.secrets.manualSecretsName }}
        property: LAGO_ENCRYPTION_DETERMINISTIC_KEY
    - secretKey: encryptionKeyDerivationSalt
      remoteRef:
        key: {{ .Values.lago.secrets.manualSecretsName }}
        property: LAGO_ENCRYPTION_KEY_DERIVATION_SALT
    - secretKey: secretKeyBase
      remoteRef:
        key: {{ .Values.lago.secrets.manualSecretsName }}
        property: LAGO_SECRET_KEY_BASE
    - secretKey: rsaPrivateKey
      remoteRef:
        key: {{ .Values.lago.secrets.manualSecretsName }}
        property: LAGO_RSA_PRIVATE_KEY
{{- end }}
{{- end }}
