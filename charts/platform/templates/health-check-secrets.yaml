{{- if .Values.healthcheck.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.healthcheck.secrets.name | default "health-check-secrets" }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.healthcheck.secrets.name | default "health-check-secrets" }}
    creationPolicy: Owner
  data: # these are in the litellm key area
    - secretKey: HF_CURRENT_AI_CREDITS
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: HF_CURRENT_AI_CREDITS
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: OPENROUTER_API_KEY
    - secretKey: ZUPLO_TEST
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: ZUPLO_TEST
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: LITELLM_MASTER_KEY
    - secretKey: SEALION_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: SEALION_API_KEY
    - secretKey: BIELIK_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: BIELIK_API_KEY
    - secretKey: INFOMANIAK_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: INFOMANIAK_API_KEY
    - secretKey: FEATHERLESS_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: FEATHERLESS_API_KEY
    - secretKey: PHOENIQS_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: PHOENIQS_API_KEY
    - secretKey: NEXBIT_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: NEXBIT_API_KEY
    - secretKey: JUELICH_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: JUELICH_API_KEY
    - secretKey: CURRENTAI_ROUTER_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: CURRENTAI_ROUTER_API_KEY
    - secretKey: MISTRAL_API_KEY
      remoteRef:
        key: {{ .Values.healthcheck.secrets.manualSecretsName }}
        property: MISTRAL_API_KEY
{{- end }}
