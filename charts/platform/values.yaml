# Global values for platform umbrella chart
global:
  # Shared namespace for all services
  namespace: platform
  
  # Current deployment environment (e.g., staging, prod)
  environment: ""

  # AWS configuration
  aws:
    region: ""

# LiteLLM configuration
litellm:
  enabled: true
  secrets:
    litellmMasterKey: ""
  lago:
    enabled: true  # Set to true to enable Lago billing integration

# Lago billing platform configuration (official chart)
lago:
  enabled: true

  # Service Account configuration for IRSA (IAM Roles for Service Accounts)
  serviceAccount:
    roleArn: ""

  # Required URLs
  apiUrl: ""
  frontUrl: ""

  # Use existing external database and Redis
  global:
    databaseUrl: ""  # Set via --set from web.sh
    redisUrl: ""  # Set via --set from web.sh

    # Disable signup
    signup:
      enabled: true

    # Enable S3 storage
    s3:
      enabled: true
      bucket: ""
      region: ""
      endpoint: ""

    # SMTP configuration
    smtp:
      enabled: false
      fromEmail: ""

    # Disable PDF generation for now
    pdf:
      enabled: true

    # Disable ingress (we're using our own)
    ingress:
      enabled: false

  # Disable internal PostgreSQL and Redis (using external)
  postgresql:
    enabled: false

  redis:
    enabled: false

  # Resource configuration
  front:
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  api:
    replicaCount: 1
    resources:
      requests:
        memory: "1536Mi"
        cpu: "200m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  worker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  # All worker types (billing, clock, events, payment, pdf, webhook)
  billingWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  clockWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  # PDF service (Gotenberg)
  pdf:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "500m"

  eventsWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  paymentWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  pdfWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"

  webhookWorker:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "1000m"


# Health check configuration
healthcheck:
  enabled: true
  replicaCount: 1
  image:
    repository: "ghcr.io/forpublicai/chat.publicai.co/health-check"
    tag: "latest"
    pullPolicy: "Always"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  secrets:
    name: health-check-secrets
    manualSecretsName: ""
    managedSecretsName: ""

# Prometheus config for web authentication
prometheus:
  adminUser: ""
  adminPassword: ""

# Database initializer Job config
dbInitializer:
  enabled: true

# Model list service configuration
modellist:
  enabled: false # Disabled by default; enabled only in staging
  replicaCount: 1
  image:
    repository: "ghcr.io/forpublicai/chat.publicai.co/model-list"
    tag: "sha-4f8522c"
    pullPolicy: "Always"
  litellmEndpoint: "http://litellm-service.platform.svc.cluster.local:4000"
  excludeModels: "cohere,mock"
  checkIntervalSeconds: 600
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  secrets:
    name: model-list-secrets
    manualSecretsName: ""
