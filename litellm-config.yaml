# Local LiteLLM config, modeled on Public AI's production config.
#
# Production equivalent: chat.publicai.co/charts/platform/charts/litellm/templates/configmap.yaml,
# which builds this file from one YAML per model under .../litellm/models/<vendor>/<model>.yaml.
#
# Difference from production: production points each model at the real inference
# partners (Infomaniak, CSCS, Featherless, Juelich, AI Singapore...). Locally we point
# them at Public AI's own public API (api.publicai.co), so we use the same models
# without needing their partner keys.
#
# Check the model IDs first:
#   curl -s https://api.publicai.co/v1/models \
#     -H "Authorization: Bearer $PUBLICAI_API_KEY" -H "User-Agent: public-ai-local/0.1"
# and edit the `model: openai/<id>` lines below to match what that returns.

model_list:
  # --- AI Singapore SEA-LION: default for dev work, consistently fast and reliable ---
  - model_name: aisingapore/Gemma-SEA-LION-v4-27B-IT
    litellm_params:
      model: openai/aisingapore/Gemma-SEA-LION-v4-27B-IT
      api_base: https://api.publicai.co/v1
      api_key: os.environ/PUBLICAI_API_KEY
      extra_headers:
        User-Agent: public-ai-local/0.1
    model_info:
      input_cost_per_token: 0.00000020
      output_cost_per_token: 0.00000040

  # --- Offline mock: works with no API key, for testing the plumbing ---
  - model_name: local/mock
    litellm_params:
      model: openai/mock
      mock_response: "Hello from the local LiteLLM mock. The plumbing works."

  # --- Swiss AI Apertus (same public name as production) ---
  # Flagged as intermittently unhealthy on status.publicai.co as of this investigation
  # (see public-ai-kit/notes/slowness-investigation.md) — left available but not the
  # default, so dev work isn't blocked by hangs on this specific model.
  - model_name: swiss-ai/apertus-v1.5-8b
    litellm_params:
      model: openai/swiss-ai/apertus-v1.5-8b      # "openai/" = speak the OpenAI-compatible protocol
      api_base: https://api.publicai.co/v1
      api_key: os.environ/PUBLICAI_API_KEY
      extra_headers:
        User-Agent: public-ai-local/0.1           # Public AI's docs require a User-Agent (Cloudflare)
      temperature: 0.8
      top_p: 0.9
      max_tokens: 4096
    model_info:
      input_cost_per_token: 0.00000010
      output_cost_per_token: 0.0000002

router_settings:
  routing_strategy: simple-shuffle        # same as production
  fallbacks:                              # production declares these per model file
    - swiss-ai/apertus-v1.5-8b:
        - aisingapore/Gemma-SEA-LION-v4-27B-IT

litellm_settings:
  drop_params: true                       # same as production
  num_retries: 1
  request_timeout: 20
  # Production also sets: callbacks for Lago (billing) and Prometheus, Redis caching,
  # extra_spend_tag_headers for x-openwebui-user-*. Left out locally on purpose.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Production maps OpenWebUI's forwarded user header to a LiteLLM "customer",
  # which is how per-user budgets work. Kept here so you can watch the header arrive.
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: customer
