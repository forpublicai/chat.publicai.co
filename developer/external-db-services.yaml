apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: chat
---
# External Postgres in platform namespace
apiVersion: v1
kind: Service
metadata:
  name: external-postgres
  namespace: platform
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-postgres
  namespace: platform
subsets:
  - addresses:
      - ip: 10.244.0.1
    ports:
      - name: postgres
        port: 5432
---
# External Redis in platform namespace
apiVersion: v1
kind: Service
metadata:
  name: external-redis
  namespace: platform
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-redis
  namespace: platform
subsets:
  - addresses:
      - ip: 10.244.0.1
    ports:
      - name: redis
        port: 6379
---
# External Postgres in chat namespace
apiVersion: v1
kind: Service
metadata:
  name: external-postgres
