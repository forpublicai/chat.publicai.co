global:
  environment: staging
  aws:
    region: us-east-1

litellm:
  app:
    image:
      repository: ghcr.io/forpublicai/litellm-v2
      tag: "pai-v1.104.2-b23"
  secrets:
    manualSecretsName: "staging/aichat/litellm/manual-secrets"
    managedSecretsName: "staging/aichat/open-webui/managed-secrets"
    dbPasswordArn: "staging/aichat/database/password"
    redisUrlProperty: "LITELLM_REDIS_URL"
    redisHostProperty: "LITELLM_REDIS_HOST"
  prometheus:
    enabled: true

lago:
  version: "1.55.0"
  image:
    repository: ghcr.io/forpublicai/lago-api
    tag: pai-v1.55.0-b4
  serviceAccount:
    roleArn: "arn:aws:iam::818561370924:role/staging-Lago-IRSA-Role"
  apiUrl: "https://lago-api.ai-staging.chat"
  frontUrl: "https://lago.ai-staging.chat"
  global:
    existingSecret: lago-db-secrets
    s3:
      enabled: true
      bucket: "staging-aichat-bucket"
      region: "us-east-1"
      endpoint: "https://s3.us-east-1.amazonaws.com"
    smtp:
      enabled: false
      fromEmail: "support@ai-staging.chat"
  api:
    extraEnv:
      LAGO_DISABLE_PDF_GENERATION: "true"
    livenessProbe:
      initialDelaySeconds: 90
  worker:
    extraEnv:
      LAGO_DISABLE_PDF_GENERATION: "true"
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  billingWorker:
    extraEnv:
      LAGO_DISABLE_PDF_GENERATION: "true"
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  clock:
    extraEnv:
      SIDEKIQ_CLOCK: "true"
  clockWorker:
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  eventsWorker:
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  paymentWorker:
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  pdf:
    replicas: 0
  pdfWorker:
    enabled: false
    extraEnv:
      LAGO_DISABLE_PDF_GENERATION: "true"
    livenessProbe:
      initialDelaySeconds: 90
  webhookWorker:
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname

grafana:
  secretsName: "staging/aichat/grafana/secrets"

healthcheck:
  enabled: false
  secrets:
    manualSecretsName: "staging/aichat/litellm/manual-secrets"
    managedSecretsName: "staging/aichat/open-webui/managed-secrets"

modellist:
  enabled: false
  image:
    repository: "ghcr.io/forpublicai/chat.publicai.co/model-list"
    tag: "sha-4f8522c"
  litellmEndpoint: "http://litellm-service.platform.svc.cluster.local:4000"
  excludeModels: "cohere,mock"
  secrets:
    manualSecretsName: "staging/aichat/litellm/manual-secrets"
