# Staging overrides for standalone Loki community chart
deploymentMode: SingleBinary
loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage_config:
    filesystem:
      directory: /data/loki/chunks
singleBinary:
  replicas: 1
  persistence:
    storageClass: gp3-sc
gateway:
  enabled: false
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
