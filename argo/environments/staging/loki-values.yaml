# Staging overrides for standalone Loki community chart
deploymentMode: SingleBinary
compactor:
  retention_enabled: true
  working_directory: /var/loki/compactor
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    retention_period: 168h
    volume_enabled: true
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage_config:
    filesystem:
      directory: /var/loki/chunks
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3-sc
    size: 10Gi
gateway:
  enabled: false
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
