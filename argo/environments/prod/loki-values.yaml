# Production overrides for standalone Loki community chart
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    delete_request_store: filesystem
  limits_config:
    retention_period: 168h
    volume_enabled: true
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage_config:
    filesystem:
      directory: /var/loki/chunks
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    storageClass: ebs-sc
    size: 30Gi
chunksCache:
  allocatedMemory: 512
  allocatedCPU: 100m
resultsCache:
  allocatedMemory: 256
  allocatedCPU: 100m
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
