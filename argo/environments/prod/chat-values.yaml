global:
  aws:
    region: eu-central-2

open-webui:
  app:
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: v0.11.3
    webuiUrl: "https://chat.publicai.co"
    auth:
      signoutRedirectUrl: "https://chat.publicai.co/auth"
    storage:
      s3:
        bucketName: "publicai-bucket"
        region: "eu-central-2"
        endpointUrl: "https://s3.eu-central-2.amazonaws.com"
    # Safe Rollout & Zero-Downtime Strategy
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    progressDeadlineSeconds: 1200
    minReadySeconds: 10
    probes:
      readiness:
        enabled: true
        path: /health
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      liveness:
        enabled: true
        path: /health
        initialDelaySeconds: 900
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
  serviceAccount:
    roleArn: "arn:aws:iam::901779868336:role/OpenWebUI-IRSA-Role"
  secrets:
    name: chat-secrets
    manualSecretsName: "prod/publicai/open-webui/manual-secrets"
    managedSecretsName: "prod/publicai/open-webui/managed-secrets"
    dbPasswordArn: "prod/publicai/database/password"
