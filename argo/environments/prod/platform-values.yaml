global:
  environment: prod
  aws:
    region: eu-central-2

litellm:
  app:
    image:
      repository: ghcr.io/forpublicai/litellm-v2
      tag: "pai-v1.104.2-b22"
    replicas: 2
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
  enabled: true # Set to false to temporarily turn off the LiteLLM deployment in prod
  secrets:
    manualSecretsName: "prod/publicai/litellm/manual-secrets"
    managedSecretsName: "prod/publicai/open-webui/managed-secrets"
    dbPasswordArn: "prod/publicai/database/password"
    redisUrlProperty: "LITELLM_REDIS_URL"
    redisHostProperty: "LITELLM_REDIS_HOST"
  prometheus:
    enabled: true
  config:
    general_settings:
      store_prompts_in_spend_logs: false
      maximum_spend_logs_retention_period: "7d"
      maximum_spend_logs_retention_interval: "1d"

lago:
  version: "1.55.0"
  image:
    repository: ghcr.io/forpublicai/lago-api
    tag: pai-v1.55.0-b4
  encryption:
    existingSecret: lago-encryption-secrets
  secrets:
    manualSecretsName: "prod/publicai/lago/manual-secrets"
  serviceAccount:
    roleArn: "arn:aws:iam::901779868336:role/Lago-IRSA-Role"
  apiUrl: "https://lago-api.publicai.co"
  frontUrl: "https://lago.publicai.co"
  global:
    existingSecret: lago-db-secrets
    s3:
      enabled: true
      bucket: "publicai-bucket"
      region: "eu-central-2"
      endpoint: "https://s3.eu-central-2.amazonaws.com"
    smtp:
      enabled: false
      fromEmail: "support@publicai.co"
  api:
    extraEnv:
      LAGO_DISABLE_PDF_GENERATION: "true"
    livenessProbe:
      initialDelaySeconds: 90
  worker:
    extraEnv:
      LAGO_DISABLE_PDF_GENERATION: "true"
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  billingWorker:
    extraEnv:
      LAGO_DISABLE_PDF_GENERATION: "true"
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  clock:
    extraEnv:
      SIDEKIQ_CLOCK: "true"
  clockWorker:
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  eventsWorker:
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  paymentWorker:
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  pdf:
    replicas: 0
  pdfWorker:
    enabled: false
    extraEnv:
      LAGO_DISABLE_PDF_GENERATION: "true"
    livenessProbe:
      initialDelaySeconds: 90
  webhookWorker:
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname

grafana:
  secretsName: "prod/publicai/grafana/secrets"

healthcheck:
  enabled: true
  secrets:
    manualSecretsName: "prod/publicai/litellm/manual-secrets"
    managedSecretsName: "prod/publicai/open-webui/managed-secrets"

dbInitializer:
  enabled: false

modellist:
  enabled: true
  image:
    repository: "ghcr.io/forpublicai/chat.publicai.co/model-list"
    tag: "sha-4f8522c"
  litellmEndpoint: "http://litellm-service.platform.svc.cluster.local:4000"
  excludeModels: "cohere,mock"
  secrets:
    manualSecretsName: "prod/publicai/litellm/manual-secrets"

