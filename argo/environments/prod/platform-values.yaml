global:
  environment: prod
  aws:
    region: eu-central-2

litellm:
  app:
    image:
      repository: ghcr.io/forpublicai/litellm-v2
      tag: "pai-v1.104.2-b23"
    replicas: 2
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5
    readinessProbe:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
    resources:
      requests:
        memory: "2Gi"
        cpu: "300m"
      limits:
        memory: "4Gi"
        cpu: "1000m"
  autoscaling:
    minReplicas: 2
    maxReplicas: 4
  enabled: true # Set to false to temporarily turn off the LiteLLM deployment in prod
  secrets:
    manualSecretsName: "prod/publicai/litellm/manual-secrets"
    managedSecretsName: "prod/publicai/open-webui/managed-secrets"
    dbPasswordArn: "prod/publicai/database/password"
    redisUrlProperty: "LITELLM_REDIS_URL"
    redisHostProperty: "LITELLM_REDIS_HOST"
  prometheus:
    enabled: true
  config:
    general_settings:
      store_prompts_in_spend_logs: false
      maximum_spend_logs_retention_period: "7d"
      maximum_spend_logs_retention_interval: "1d"

lago:
  version: "1.55.0"
  image:
    repository: ghcr.io/forpublicai/lago-api
    tag: pai-v1.55.0-b4
  encryption:
    existingSecret: lago-encryption-secrets
  secrets:
    manualSecretsName: "prod/publicai/lago/manual-secrets"
  serviceAccount:
    roleArn: "arn:aws:iam::901779868336:role/Lago-IRSA-Role"
  apiUrl: "https://lago-api.publicai.co"
  frontUrl: "https://lago.publicai.co"
  global:
    existingSecret: lago-db-secrets
    pdf:
      enabled: false
    s3:
      enabled: true
      bucket: "publicai-bucket"
      region: "eu-central-2"
      endpoint: "https://s3.eu-central-2.amazonaws.com"
    smtp:
      enabled: false
      fromEmail: "support@publicai.co"
  front:
    resources:
      requests:
        memory: "64Mi"
        cpu: "25m"
      limits:
        memory: "256Mi"
        cpu: "250m"
  api:
    extraEnv:
      LAGO_CHECKOUT_AUTO_PAYMENT_DELAY_SECONDS: "10"
    livenessProbe:
      initialDelaySeconds: 90
  worker:
    extraEnv:
      LAGO_CHECKOUT_AUTO_PAYMENT_DELAY_SECONDS: "10"
    resources:
      requests:
        memory: "512Mi"
        cpu: "50m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  billingWorker:
    extraEnv:
      LAGO_CHECKOUT_AUTO_PAYMENT_DELAY_SECONDS: "0"
      MALLOC_CONF: "dirty_decay_ms:1000,muzzy_decay_ms:1000,background_thread:true,narenas:2"
      RUBY_GC_HEAP_GROWTH_FACTOR: "1.1"
    rails:
      sidekiqConcurrency: 2
    resources:
      requests:
        memory: "5Gi"
        cpu: "500m"
      limits:
        memory: "10Gi"
        cpu: "1000m"
    livenessProbe:
      initialDelaySeconds: 90
      timeoutSeconds: 5
      failureThreshold: 5
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  clock:
    extraEnv:
      SIDEKIQ_CLOCK: "true"
    resources:
      requests:
        memory: "384Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "250m"
  clockWorker:
    resources:
      requests:
        memory: "512Mi"
        cpu: "50m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  eventsWorker:
    resources:
      requests:
        memory: "512Mi"
        cpu: "50m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  paymentWorker:
    extraEnv:
      LAGO_CHECKOUT_AUTO_PAYMENT_DELAY_SECONDS: "0"
    resources:
      requests:
        memory: "512Mi"
        cpu: "50m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname
  pdf:
    replicas: 0
  pdfWorker:
    enabled: false
    livenessProbe:
      initialDelaySeconds: 90
  webhookWorker:
    resources:
      requests:
        memory: "512Mi"
        cpu: "50m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    livenessProbe:
      initialDelaySeconds: 90
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openwebui
              namespaces:
                - chat
              topologyKey: kubernetes.io/hostname

grafana:
  secretsName: "prod/publicai/grafana/secrets"

healthcheck:
  enabled: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  secrets:
    manualSecretsName: "prod/publicai/litellm/manual-secrets"
    managedSecretsName: "prod/publicai/open-webui/managed-secrets"

dbInitializer:
  enabled: false

modellist:
  enabled: true
  image:
    repository: "ghcr.io/forpublicai/chat.publicai.co/model-list"
    tag: "sha-4f8522c"
  litellmEndpoint: "http://litellm-service.platform.svc.cluster.local:4000"
  excludeModels: "cohere,mock"
  secrets:
    manualSecretsName: "prod/publicai/litellm/manual-secrets"

