services:
  openwebui-backend:
    build:
      context: ../open-webui/backend
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        RUN apt-get update && apt-get install -y build-essential && rm -rf /var/lib/apt/lists/*
        RUN mkdir -p /tmp/static
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        EXPOSE 8080
        CMD ["python3", "-m", "uvicorn", "open_webui.main:app", "--host", "0.0.0.0", "--port", "8080", "--forwarded-allow-ips", "*", "--reload"]
    container_name: publicai-openwebui-backend
    ports:
      - "8080:8080"
    environment:
      STATIC_DIR: /tmp/static
      CORS_ALLOW_ORIGIN: "http://localhost:5173;http://localhost:8080"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: local-dev-secret
    volumes:
      - ../open-webui/backend:/app
      # env.py reads this via pkgutil at import time; it lives at the repo root,
      # not inside backend/, so it needs its own mount or the backend crashes on startup.
      - ../open-webui/CHANGELOG.md:/app/open_webui/CHANGELOG.md:ro
    depends_on:
      - litellm

  openwebui-frontend:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-slim
        WORKDIR /app
        EXPOSE 5173
        CMD sh -c "npm install && npm run dev -- --host 0.0.0.0"
    container_name: publicai-openwebui-frontend
    ports:
      - "5173:5173"
    environment:
      WEBUI_BACKEND_URL: http://openwebui-backend:8080
    volumes:
      - ../open-webui:/app
      - openwebui-frontend-node-modules:/app/node_modules
    depends_on:
      - openwebui-backend

volumes:
  openwebui-frontend-node-modules:
