services:
  openwebui-backend:
    build:
      # OPENWEBUI_SRC lets you point this at a different clone/fork — see
      # .env.example. Defaults to a sibling checkout next to this repo.
      context: ${OPENWEBUI_SRC:-../open-webui}/backend
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        RUN apt-get update && apt-get install -y build-essential && rm -rf /var/lib/apt/lists/*
        RUN mkdir -p /tmp/static
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        EXPOSE 8080
        CMD ["python3", "-m", "uvicorn", "open_webui.main:app", "--host", "0.0.0.0", "--port", "8080", "--forwarded-allow-ips", "*", "--reload"]
    container_name: publicai-openwebui-backend
    working_dir: /repo/backend
    ports:
      - "8080:8080"
    environment:
      STATIC_DIR: /tmp/static
      CORS_ALLOW_ORIGIN: "http://localhost:5173;http://localhost:8080"
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: local-dev-secret
      # Keeps env vars authoritative instead of letting OpenWebUI persist them to
      # its database after first run, where later env var changes stop applying.
      ENABLE_PERSISTENT_CONFIG: "false"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/openwebui
    volumes:
      # Whole repo, not just backend/ — env.py's BASE_DIR (two dirs above itself)
      # needs to land on the real repo root to find CHANGELOG.md and package.json
      # directly; mounting only backend/ makes both silently fall back (missing
      # changelog, version reported as "0.0.0").
      - ${OPENWEBUI_SRC:-../open-webui}:/repo
    depends_on:
      litellm:
        condition: service_started
      postgres:
        condition: service_healthy

  openwebui-frontend:
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-slim
        WORKDIR /app
        EXPOSE 5173
        CMD sh -c "npm install && npm run dev -- --host 0.0.0.0"
    container_name: publicai-openwebui-frontend
    ports:
      - "5173:5173"
    environment:
      WEBUI_BACKEND_URL: http://openwebui-backend:8080
    volumes:
      - ${OPENWEBUI_SRC:-../open-webui}:/app
      - openwebui-frontend-node-modules:/app/node_modules
    depends_on:
      - openwebui-backend

volumes:
  openwebui-frontend-node-modules:
